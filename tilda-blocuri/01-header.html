<!--
  MoreLeads · Bloc 01 · HEADER
  Meniu fix sus + bară de contact fixă jos pe mobil (apare după ce vizitatorul derulează).
  Antetul e un panou de sticlă care plutește deasupra paginii. Logo-ul e doar semnul MoreLeads, vectorizat (SVG),
  cu luciul lavandă din logo, ca să rămână clar la orice mărime.
  Nu adăuga un meniu Tilda separat pe pagină.
-->
<div class="ml ml-hd-space" id="top" aria-hidden="true"></div>
<header class="ml ml-hd">
  <div class="ml-wrap ml-hd__in">
    <a class="ml-brand" href="#top" aria-label="MoreLeads, înapoi sus">
      <svg class="ml-brand__mark" viewBox="0 0 503 514" aria-hidden="true">
        <defs>
          <radialGradient id="mlLogoHdL" cx=".6" cy=".6" r=".65">
            <stop offset="0" stop-color="#E0CFFF"/><stop offset=".38" stop-color="#B08AFF"/><stop offset=".78" stop-color="#8650F5"/><stop offset="1" stop-color="#7643EC"/>
          </radialGradient>
          <linearGradient id="mlLogoHdR" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#25225C"/><stop offset="1" stop-color="#1B1945"/>
          </linearGradient>
        </defs>
        <path fill="url(#mlLogoHdL)" d="M113 185.6A251.5 179 0 0 0 230.5 513.4L230.5 54 141 92 141 366.2A176 85 0 0 1 113 247.6Z"/>
        <path fill="url(#mlLogoHdR)" d="M390 185.6A251.5 179 0 0 1 272.5 513.4L272.5 37 362 0 362 366.2A176 85 0 0 0 390 247.6Z"/>
      </svg>
    </a>
    <nav class="ml-hd__nav" aria-label="Navigare pe pagină">
      <a href="#portofoliu">Portofoliu</a>
      <a href="#rezultate">Rezultate</a>
      <a href="#preturi">Prețuri</a>
      <a href="#proces">Cum lucrăm</a>
      <a href="#intrebari">Întrebări</a>
    </nav>
    <div class="ml-hd__act">
      <a class="ml-hd__tel" href="tel:+37378000525" data-ml-cta="header">+373 78 000 525</a>
      <a class="ml-btn ml-btn--accent ml-btn--sm ml-hd__cta" href="#popup:schita" data-ml-cta="header">Cere oferta gratuită</a>
      <a class="ml-hd__icon" href="tel:+37378000525" data-ml-cta="header" aria-label="Sună-ne: +373 78 000 525">
        <svg class="ml-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      </a>
    </div>
  </div>
</header>

<div class="ml ml-mbar" role="region" aria-label="Contact rapid">
  <a class="ml-btn ml-btn--accent" href="#popup:schita" data-ml-cta="bara-mobil">Cere oferta gratuită</a>
  <a class="ml-mbar__wa" href="https://wa.me/37378000525" target="_blank" rel="noopener" data-ml-cta="bara-mobil" aria-label="Scrie-ne pe WhatsApp">
    <svg class="ml-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20l1.2-4.9A8.5 8.5 0 1 1 21 11.5z"/></svg>
  </a>
</div>

<style>
.ml-hd-space{height:calc(var(--ml-header-h) + var(--ml-header-top));background:var(--ml-bg)}
/* Panou de sticlă: plutește la --ml-header-top de marginea de sus, conținutul se vede blurat prin el */
.ml-hd{position:fixed;top:var(--ml-header-top);left:50%;z-index:990;width:min(1264px,calc(100% - 56px));transform:translateX(-50%);border:1px solid var(--ml-glass-line);border-radius:18px;background:var(--ml-glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 30px -14px rgba(28,26,69,.16);transition:box-shadow .25s var(--ml-ease)}
.ml-hd.is-scrolled{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 14px 34px -12px rgba(28,26,69,.24)}
/* fără suport pentru blur, panoul devine aproape opac, ca textul de dedesubt să nu încurce meniul */
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.ml-hd,.ml-mbar{background:rgba(255,255,255,.96)}}
.ml-hd .ml-wrap{padding:0 10px 0 18px}
.ml-hd__in{height:var(--ml-header-h);display:flex;align-items:center;gap:32px}
.ml-brand{display:flex;align-items:center;color:var(--ml-ink)}
.ml-brand__mark{display:block;width:auto;height:40px}
.ml-hd__nav{display:flex;gap:32px;margin-left:24px;font-size:15px;color:var(--ml-text)}
.ml-hd__nav a{padding:10px 0;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:6px;transition:color .2s,text-decoration-color .2s}
.ml-hd__nav a:hover{color:var(--ml-ink);text-decoration-color:currentColor}
.ml-hd__act{display:flex;align-items:center;gap:24px;margin-left:auto}
.ml-hd__tel{font-size:15px;font-weight:500;color:var(--ml-ink);white-space:nowrap}
.ml-hd__tel:hover{color:var(--ml-accent)}
.ml-hd__icon{display:none;width:44px;height:44px;align-items:center;justify-content:center;color:var(--ml-ink);border:1px solid var(--ml-line-2);border-radius:8px}
.ml-mbar{display:none}

@media (max-width:1100px){.ml-hd__nav{display:none}}
@media (max-width:640px){
  .ml-hd{width:calc(100% - 2 * var(--ml-header-top));border-radius:16px}
  .ml-hd .ml-wrap{padding:0 8px 0 14px}
  .ml-brand__mark{height:34px}
  .ml-hd__tel,.ml-hd__cta{display:none}
  .ml-hd__icon{display:flex}
  /* bara de jos: tot sticlă, plutind deasupra marginii (și deasupra barei de gesturi de pe iPhone) */
  .ml-mbar{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:989;gap:8px;padding:8px;border:1px solid var(--ml-glass-line);border-radius:18px;background:var(--ml-glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 30px -12px rgba(28,26,69,.25);transform:translateY(calc(100% + 24px));transition:transform .35s var(--ml-ease)}
  .ml-mbar.is-on{transform:none}
  .ml-mbar .ml-btn{flex:1;height:50px}
  .ml-mbar__wa{width:50px;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--ml-line-2);border-radius:50%;background:rgba(255,255,255,.5);color:var(--ml-ink)}
}
</style>
<script>
(function () {
  var hd = document.querySelector('.ml-hd');
  var bar = document.querySelector('.ml-mbar');
  var ticking = false;
  // Bara de jos nu dublează un buton „Cere schița” care e deja pe ecran (primul ecran, garanții, contact)
  var ctaInView = 0;
  if (bar && 'IntersectionObserver' in window) {
    var seen = [];
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var i = seen.indexOf(en.target);
        if (en.isIntersecting && i < 0) seen.push(en.target);
        if (!en.isIntersecting && i > -1) seen.splice(i, 1);
      });
      ctaInView = seen.length;
      update();
    });
    var watch = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.ml-hero__cta, .ml-gr__cta, .ml-ct__btns'), function (el) { io.observe(el); });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  }
  function update() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    if (hd) hd.classList.toggle('is-scrolled', y > 8);
    if (bar) bar.classList.toggle('is-on', y > 520 && ctaInView === 0);
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
  }, { passive: true });
  update();
})();
</script>
