<style>
.ml-cl{background:var(--ml-bg);padding:0 0 8px}
.ml-cl__card{flex-direction:row;align-items:center;gap:32px;padding:20px 0 20px 28px}
.ml-cl__t{flex-shrink:0;width:200px;line-height:1.35}

  .ml-cl__t{width:auto;padding:0 18px}

}
